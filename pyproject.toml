[project]
name = "opencommune"
version = "0.1.0"
description = "Tractanda: crawler and database build for an open archive of Swiss municipal documents"
readme = "README.md"
authors = [{ name = "David Zollikofer" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "soupsieve>=2.9.2",
    "lxml>=6.0",
    "certifi",
    "pymupdf==1.28.2",
]

[project.optional-dependencies]
# The privacy check's worker (`opencommune privacy detect`); it runs on a GPU machine.
privacy = ["gheim[local]==0.1.11", "huggingface-hub"]

[project.urls]
Homepage = "https://www.tractanda.ch"
Repository = "https://github.com/davidrzs/tractanda"
Issues = "https://github.com/davidrzs/tractanda/issues"

[project.scripts]
opencommune = "opencommune.cli:app"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "DTZ", "ISC", "BLE"]
# E501: line length is the formatter's job; what it leaves long is a literal or a URL.
ignore = ["B008", "DTZ011", "E501"]
# The en dash in German page copy and the no-break space in the parser's whitespace regex.
allowed-confusables = ["\u2013", "\u00a0"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ001", "C408"]

[tool.pytest.ini_options]
testpaths = ["tests"]
